<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Ocean Scene</title>

<!-- Unit 8 Project

Requirements

[ x ] Custom Function #1 - Takes Parameters

[ x ] Custom Function #2 - Takes Parameters

[ x ] Custom Function #3 - Takes Parameters

[ x ] Three Comments

Select ONE Additional  

[ x ] Feature 3 - mouseClicked feature

-->

</head>

<body>

<h1>The Ocean</h1>

<canvas id="oceanCanvas" width="600" height="400"></canvas>

<script>

let canvas = document.getElementById("oceanCanvas");

let ctx = canvas.getContext("2d");

// stores click position

let clickX = 0;

let clickY = 0;

let showBubble = false;

/* draw ocean water */

function ocean(x, y, w, h){

  ctx.fillStyle = "rgb(0,100,200)";

  ctx.fillRect(x, y, w, h);

}

/* draw fish */

function fish(x, y, r, g, b){

  ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";

  ctx.beginPath();

  ctx.ellipse(x, y, 20, 10, 0, 0, Math.PI*2);

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(x-20, y);

  ctx.lineTo(x-35, y-10);

  ctx.lineTo(x-35, y+10);

  ctx.fill();

  ctx.fillStyle = "black";

  ctx.beginPath();

  ctx.arc(x+10, y-3, 3, 0, Math.PI*2);

  ctx.fill();

}

/* draw seaweed */

function seaweed(x, y, h){

  ctx.strokeStyle = "green";

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.moveTo(x,y);

  ctx.lineTo(x,y-h);

  ctx.stroke();

}

/* NEW: draw bubble where user clicks */

function bubble(x, y){

  ctx.fillStyle = "white";

  ctx.beginPath();

  ctx.arc(x, y, 10, 0, Math.PI*2);

  ctx.fill();

}

/* background sky */

ctx.fillStyle = "rgb(120,200,255)";

ctx.fillRect(0,0,600,400);

// ocean

ocean(0,250,600,150);

// fish with random colors

fish(120,300, Math.random()*255, Math.random()*255, Math.random()*255);

fish(250,320, Math.random()*255, Math.random()*255, Math.random()*255);

fish(420,290, Math.random()*255, Math.random()*255, Math.random()*255);

// seaweed

seaweed(80,350,50);

seaweed(150,350,60);

seaweed(500,350,55);

// show bubble if clicked

if (showBubble) {

  bubble(clickX, clickY);

}

/* mouse click feature */

canvas.addEventListener("click", function(event){

  let rect = canvas.getBoundingClientRect();

  clickX = event.clientX - rect.left;

  clickY = event.clientY - rect.top;

  showBubble = true;

  // redraw scene so bubble appears

  ctx.fillStyle = "rgb(120,200,255)";

  ctx.fillRect(0,0,600,400);

  ocean(0,250,600,150);

  fish(120,300, Math.random()*255, Math.random()*255, Math.random()*255);

  fish(250,320, Math.random()*255, Math.random()*255, Math.random()*255);

  fish(420,290, Math.random()*255, Math.random()*255, Math.random()*255);

  seaweed(80,350,50);

  seaweed(150,350,60);

  seaweed(500,350,55);

  bubble(clickX, clickY);

});

</script>

</body>

</html>
